name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7"

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot and export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot && cd ~/godot
          curl -sSLo godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          curl -sSLo templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz && rm templates.tpz
          # Só precisamos dos templates de Windows.
          find templates -type f ! -name 'windows_*' ! -name version.txt -delete

      - name: Install export templates
        run: |
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest" && cp ~/godot/templates/* "$dest/"

      - name: Export
        run: |
          godot=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          $godot --headless --import
          mkdir -p build/windows
          $godot --headless --export-release "Windows Desktop" build/windows/OrderUp.exe
          test -f build/windows/OrderUp.exe

      - uses: actions/upload-artifact@v4
        with:
          name: OrderUp-windows
          path: build/windows/
