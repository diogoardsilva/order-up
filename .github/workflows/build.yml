name: Build

on:
  push:
    branches: [main, claude/project-thread-1g23o0]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7"

jobs:
  export:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            preset: "Windows Desktop"
            file: OrderUp.exe
            templates: "windows_*"
          - platform: linux
            preset: "Linux"
            file: OrderUp.x86_64
            templates: "linux_*"
          - platform: macos
            preset: "macOS"
            file: OrderUp.zip
            templates: "macos.zip"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-${{ matrix.platform }}

      - name: Download Godot and export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot && cd ~/godot
          curl -sSLo godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          curl -sSLo templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz && rm templates.tpz
          # Só ficam os templates desta plataforma.
          find templates -type f ! -name '${{ matrix.templates }}' ! -name version.txt -delete

      - name: Install export templates
        run: |
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest" && cp ~/godot/templates/* "$dest/"

      - name: Check scripts (abre cada ecrã uns segundos e procura erros)
        if: matrix.platform == 'linux'
        run: |
          godot=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          $godot --headless --import > import.log 2>&1 || true
          fail=0
          for scene in main_menu lobby level_select level; do
            timeout 120 $godot --headless --quit-after 400 res://scenes/$scene.tscn > run_$scene.log 2>&1 || true
            echo "--- $scene ($(wc -l < run_$scene.log) linhas) ---"; grep -iE "error|warning" run_$scene.log | head -20 || true
            if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Invalid assignment|Cannot call|Failed to load script|formatting error" run_$scene.log; then
              echo "::error::Erros ao abrir $scene"
              fail=1
            fi
          done
          grep -E "Parse Error|Failed to load script" import.log && fail=1
          exit $fail

      - name: Export
        run: |
          godot=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          # Número da build: o jogo usa-o para saber se há atualização.
          sed -i "/^config\/version=/a config/build=${{ github.run_number }}" project.godot
          # Cópia das definições que vai dentro do pacote (o atualizador aplica-as).
          cp project.godot update_settings.cfg
          $godot --headless --import
          mkdir -p build/${{ matrix.platform }} pck
          $godot --headless --export-release "${{ matrix.preset }}" build/${{ matrix.platform }}/${{ matrix.file }}
          test -f build/${{ matrix.platform }}/${{ matrix.file }}
          # Só o pacote do jogo (sem o executável), para as atualizações automáticas.
          $godot --headless --export-pack "${{ matrix.preset }}" pck/OrderUp-${{ matrix.platform }}.pck
          test -f pck/OrderUp-${{ matrix.platform }}.pck

      - name: Linux launcher permissions
        if: matrix.platform == 'linux'
        # O upload-artifact perde a permissão de executar; vai dentro de um tar.
        run: |
          chmod +x build/linux/OrderUp.x86_64
          tar -czf build/OrderUp-linux.tar.gz -C build/linux .
          rm -rf build/linux/* && mv build/OrderUp-linux.tar.gz build/linux/

      - uses: actions/upload-artifact@v4
        with:
          name: OrderUp-${{ matrix.platform }}
          path: build/${{ matrix.platform }}/

      - uses: actions/upload-artifact@v4
        with:
          name: pck-${{ matrix.platform }}
          path: pck/

  # Publica no release "latest" (público, sem login): os jogos instalados
  # descarregam o pacote novo sozinhos; os zips servem para instalar de raiz.
  release:
    needs: export
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Prepare files
        run: |
          mkdir -p out
          cp dl/pck-*/OrderUp-*.pck out/
          (cd dl/OrderUp-windows && zip -qr ../../out/OrderUp-windows.zip .)
          cp dl/OrderUp-linux/OrderUp-linux.tar.gz out/OrderUp-linux.tar.gz
          cp dl/OrderUp-macos/OrderUp.zip out/OrderUp-macos.zip
          version=$(grep '^config/version=' project.godot | cut -d'"' -f2)
          sha() { sha256sum "out/$1" | cut -d' ' -f1; }
          cat > out/version.json <<JSON
          {"version": "$version", "build": ${{ github.run_number }}, "godot": "${GODOT_VERSION}",
           "files": {"windows": "OrderUp-windows.pck", "linux": "OrderUp-linux.pck", "macos": "OrderUp-macos.pck"},
           "sha256": {"windows": "$(sha OrderUp-windows.pck)", "linux": "$(sha OrderUp-linux.pck)", "macos": "$(sha OrderUp-macos.pck)"}}
          JSON
          cat out/version.json
          ls -la out
      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^config/version=' project.godot | cut -d'"' -f2)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/* --target "${{ github.sha }}" --prerelease \
            --title "Order Up! $version (build ${{ github.run_number }})" \
            --notes "Versão $version, build ${{ github.run_number }}. Windows: OrderUp-windows.zip · Linux: OrderUp-linux.tar.gz · macOS: OrderUp-macos.zip. Os jogos já instalados atualizam-se sozinhos."
